<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5학년 수학 OX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 또렷한 수험 학습 도구, 군더더기 없이 문제에 집중
   IDEA: 교재를 펼친 학습 카드 — 왼쪽은 문제, 오른쪽은 해설 페이지
   PICTURE: 첫 화면의 짙은 파란 배너와 수학 기호 엠블럼, 회차별 진도 카드
   COLOUR and TYPE: 흰 바탕 + 코발트 블루 주색, O는 파랑 X는 자주, Noto Sans KR
   LAYOUT: 상단 내비 → 배너+나의 학습 → 회차 카드 그리드 → 실전과 복습 */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fb,#0f1320);--card:light-dark(#ffffff,#181e2e);--soft:light-dark(#eef2fb,#20283c);
--ink:light-dark(#161b2b,#e9edf7);--mute:light-dark(#5b6478,#9aa4bb);--line:light-dark(#dfe4ef,#2b3449);
--blue:#2f55d4;--blue2:light-dark(#1f3fae,#7d9bff);--o:light-dark(#2f55d4,#7d9bff);--x:light-dark(#9b2357,#ff7fae);
--ok:light-dark(#e6f4ea,#173326);--okink:light-dark(#1d6b3a,#7fdca2);--bad:light-dark(#fbefe0,#3a2a17);--badink:light-dark(#8a4b06,#ffc27a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;min-height:44px}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:10px 16px;border-radius:12px;text-decoration:none;color:var(--mute);font-weight:700;min-height:44px;display:flex;align-items:center}
nav a.on{background:var(--soft);color:var(--blue2)}
main.wrap{padding-top:28px;padding-bottom:64px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.15;word-break:keep-all;margin:0 0 8px;font-weight:900;text-wrap:balance}
h2{font-size:22px;margin:40px 0 14px;font-weight:900}
.lead{color:var(--mute);margin:0 0 20px}
.top{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
.hero{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 78% 50%,#3f6bff 0,#2446c9 38%,#14298a 100%);color:#fff;padding:clamp(24px,4vw,44px);min-height:300px;display:flex;flex-direction:column;justify-content:center}
.hero .tag{align-self:flex-start;border:1px solid #ffffff55;border-radius:99px;padding:4px 14px;font-size:14px;font-weight:700}
.hero h1{color:#fff;margin:18px 0 10px;max-width:8.5em;position:relative;z-index:1}.hero p,.hero .tag{position:relative;z-index:1}
.hero p{margin:0 0 22px;opacity:.9}
.hero svg{position:absolute;right:-10px;bottom:-10px;width:min(34%,240px);height:auto;opacity:.95}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border-radius:14px;padding:10px 22px;font-weight:700}
.btn.w{background:#fff;color:#1f3fae;align-self:flex-start;position:relative;z-index:1}
.btn.p{background:var(--blue);color:#fff}
.btn.g{background:var(--soft);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.me .big{font-size:clamp(40px,5vw,52px);font-weight:900;line-height:1}
.me .big span{font-size:16px;color:var(--mute);font-weight:500}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me a,.linkbtn{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-weight:700;width:100%;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.sess{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;transition:transform .15s,border-color .15s}
.sess:hover{transform:translateY(-2px);border-color:var(--blue)}
.sess.lock{opacity:.55;cursor:not-allowed;transform:none;border-style:dashed}.sess.lock:hover{border-color:var(--line)}
.pill{display:inline-block;background:var(--soft);color:var(--blue2);font-weight:700;font-size:13px;border-radius:99px;padding:2px 10px}
.sess b{display:block;font-size:22px;margin:8px 0 2px;word-break:keep-all}
.sess small{color:var(--mute);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wide{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.wide small{display:block;color:var(--mute);font-size:14px}
.yt{color:inherit;text-decoration:none;border:2px solid #e0322b;background:light-dark(#fff5f4,#2a1716);transition:transform .15s}.yt:hover{transform:translateY(-2px)}.yt b{color:light-dark(#c4221b,#ff8a84)}.ico.play{background:#e0322b;color:#fff;border-radius:50%}.yt .go{margin-left:auto;font-size:26px;font-weight:900;color:#e0322b}
.ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--blue2);flex:none}
/* study */
.back{color:var(--mute);font-weight:700;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.study{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.qhead{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;font-weight:700}
.qhead .cnt{margin-left:auto;font-weight:500}
.q{font-size:clamp(19px,2.2vw,23px);font-weight:700;line-height:1.65;margin:16px 0 22px;word-break:keep-all}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{border-radius:16px;border:2px solid transparent;background:var(--soft);min-height:64px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px}
.ox .o{color:var(--o)}.ox .x{color:var(--x)}
.ox button.sel.o{border-color:var(--o)}.ox button.sel.x{border-color:var(--x)}
.ox button.ans{box-shadow:inset 0 0 0 2px currentColor}
.exp .wait{min-height:220px;display:grid;place-items:center;text-align:center;color:var(--mute)}
.res{border-radius:16px;padding:14px 18px;font-weight:900;font-size:18px;margin-bottom:14px}
.res.ok{background:var(--ok);color:var(--okink)}.res.bad{background:var(--bad);color:var(--badink)}
.ebox{background:var(--soft);border-radius:16px;padding:16px 18px}
.ebox .row{justify-content:space-between;font-weight:900;color:var(--blue2);margin-bottom:6px}
.ebox p{margin:0;word-break:keep-all;white-space:pre-line}
.teach{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px}.side .ytc,.side .cafe{min-height:0}.side .ytc img{flex:none;height:55%;max-height:none}.side .ytc .yb{flex:1;padding:8px 14px;gap:10px}.side .ytc b{font-size:15px}.side .ytc small{font-size:12px}.side .ytc .ico{width:36px;height:36px}.cafe{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid #03a94f;border-radius:20px;background:light-dark(#effbf3,#13281c);color:inherit;text-decoration:none;transition:transform .15s}.cafe:hover{transform:translateY(-2px)}.cafe b{display:block;color:light-dark(#02853e,#6fe3a1);font-size:16px;line-height:1.35;word-break:keep-all}.cafe small{display:block;color:var(--mute);font-size:13px;margin-top:2px}.cafe{padding:0 16px 0 10px;overflow:hidden;align-items:stretch}.cafe>span{align-self:center;padding:12px 0}.cafe{position:relative;padding-left:112px!important;min-height:150px}.chimg{position:absolute;left:8px;bottom:0;height:calc(100% - 8px);width:auto;object-fit:contain;object-position:bottom}.cafe b{font-size:17px}
.ytc{display:flex;flex-direction:column;border:2px solid #e0322b;border-radius:20px;overflow:hidden;background:light-dark(#fff5f4,#2a1716);color:inherit;text-decoration:none;transition:transform .15s}.ytc:hover{transform:translateY(-2px)}.ytc img{display:block;width:100%;flex:1 1 50%;min-height:0;height:50%;object-fit:cover;object-position:55% 40%}.ytc .yb{flex:1 1 50%;display:flex;gap:12px;align-items:center;padding:14px 16px}.ytc b{display:block;color:light-dark(#c4221b,#ff8a84);font-size:16px;line-height:1.35;word-break:keep-all}.ytc small{display:block;color:var(--mute);font-size:13px;margin-top:2px;word-break:keep-all}
@media(min-width:1760px){.side .cafe{padding-left:100px!important}.top{position:relative;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}.top .side{position:absolute;top:0;bottom:0;left:calc(100% + 32px);width:min(320px,calc((100vw - 1100px)/2 - 64px))}}
@media(max-width:1080px){.top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.top .hero{grid-column:1/-1}}.teach .sess{padding:26px 28px}.teach .sess b{font-size:clamp(24px,3vw,32px)}
.nitem{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.nitem .q{font-size:17px;margin:8px 0 0;font-weight:500}
@media(max-width:600px){.teach{grid-template-columns:1fr}}
.navq{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.dots button{width:34px;height:34px;min-height:34px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:700;color:var(--mute)}
.dots button.c{background:var(--ok);color:var(--okink)}.dots button.w{background:var(--bad);color:var(--badink)}
.dots button.cur{outline:2px solid var(--blue)}
/* notes */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{border-radius:11px;padding:6px 16px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--blue2);box-shadow:0 1px 3px #0002}
select{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:44px;font-size:16px}
.nlist{display:grid;gap:14px}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{width:min(460px,100%)}
.modal h3{margin:0 0 4px;font-size:22px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.pick button{border:2px solid var(--line);border-radius:16px;padding:16px;font-weight:700;display:grid;justify-items:center;gap:6px}
.pick button.on{border-color:var(--blue);color:var(--blue2);background:var(--soft)}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:30}
@media(max-width:860px){.top,.study,.two{grid-template-columns:1fr}.hero svg{width:38%;opacity:.35}}
@media(max-width:600px){nav{margin-left:0;width:100%}nav a{flex:1;justify-content:center;padding:8px}.hd{padding:8px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}img{-webkit-user-drag:none;pointer-events:auto}@media print{body{display:none!important}}

/* 무한의 탑 */
.twr{color:inherit;text-decoration:none;max-width:620px;border:2px solid var(--blue);margin-bottom:6px}.twr img{width:52px;height:auto;flex:none}.twr b{font-size:18px}.twr .go{margin-left:auto;font-size:28px;font-weight:900;color:var(--blue2)}
#tw{max-width:1100px;margin:0 auto;display:grid;gap:14px}
#tw:fullscreen{background:var(--bg);padding:16px;overflow:auto}
.tbar{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.tbar .flag{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.tbar .fl small{display:block;font-size:12px;font-weight:700;color:var(--mute);line-height:1.2}.tbar .fl b{font-size:30px;font-weight:900;line-height:1}.tbar .fl b i{font-style:normal;font-size:14px;margin-left:2px}
.tbar .tier{border-left:1px solid var(--line);padding-left:14px;font-weight:800;font-size:15px}
.tier .tn{display:flex;align-items:center;gap:6px}.hearts{letter-spacing:2px;font-size:17px;line-height:1.2;color:#b3264f}.hearts .e{color:var(--line)}
.tbar .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.tbtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.timer{background:var(--soft);color:var(--blue2);border-radius:10px;padding:6px 10px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}.timer.low{color:#c4221b;background:light-dark(#fde8e7,#3a1a1a)}
.scene{position:relative;border-radius:22px;overflow:hidden;border:3px solid #23284a;background:#0d1030;aspect-ratio:5/2}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.scene .pg{position:absolute;left:27%;bottom:10%;height:38%;transform-origin:50% 100%;filter:drop-shadow(0 4px 0 #0005)}
.scene .pg.run{animation:hop .18s infinite alternate}.scene .pg.hurt{animation:hurt .45s}
@keyframes hop{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-7%) rotate(5deg)}}
@keyframes hurt{0%,100%{transform:none}25%{transform:translateX(-6%) rotate(-8deg)}75%{transform:translateX(6%) rotate(8deg)}}
.zone{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;background:#141833dd;color:#fff;border:1px solid #ffffff40;border-radius:14px;padding:8px 14px 8px 10px}
.zone .zi{width:36px;height:36px;border-radius:10px;background:#ffffff1f;display:grid;place-items:center;font-size:20px}
.zone small{display:block;font-size:11px;opacity:.8;line-height:1.2}.zone b{font-size:22px;font-weight:900;line-height:1.15}
.cpb{position:absolute;right:12px;top:12px;background:#141833dd;color:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;text-align:right}
.cpb.bot{top:auto;bottom:12px}
.dash{display:flex;gap:3px;margin-top:4px;justify-content:flex-end}.dash i{width:10px;height:4px;border-radius:2px;background:#ffffff40}.dash i.on{background:#ffd34d}
.qc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 22px 20px}
.qc .qt{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--mute);font-size:15px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.qc .qt .tg{margin-left:auto;background:var(--soft);color:var(--blue2);border-radius:8px;padding:2px 10px;font-size:13px}
.qc .bossnote{color:#6d3fc0;font-weight:700;font-size:15px;margin:12px 0 0}
.qc .st{font-size:clamp(19px,2.3vw,23px);font-weight:800;line-height:1.6;margin:14px 0 0;word-break:keep-all}
.fb{margin-top:14px;border-radius:14px;padding:12px 16px;background:var(--soft)}.fb .h{display:flex;justify-content:space-between;font-weight:900}.fb.ok .h{color:var(--okink)}.fb.bad .h{color:#b3264f}.fb p{margin:6px 0 0;white-space:pre-line;word-break:keep-all}
.oxb{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.oxb button{background:var(--card);border:1px solid var(--line);border-bottom-width:4px;border-radius:16px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:800}
.oxb .o{border-bottom-color:#9fd8b0}.oxb .x{border-bottom-color:#f1b3c4}
.oxb .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:22px}.oxb .o .ic{background:#e3f5e8;color:#1d6b3a}.oxb .x .ic{background:#fbe3ea;color:#9b2357}
.oxb button.sel.o{background:#e9f7ee;color:#1d6b3a}.oxb button.sel.x{background:#fcebf0;color:#9b2357}
.nextb{width:100%;min-height:58px;border-radius:16px;background:#232a6b;color:#fff;font-weight:800;font-size:18px}
.dark{position:relative;border-radius:22px;overflow:hidden;background:#0f1226;color:#fff;padding:22px}
.dark .scene{border-color:#2d3466}
.dark h2{margin:0 0 6px;font-size:26px}.dark p{margin:0;opacity:.8}
.arrow{width:52px;height:52px;border-radius:14px;background:#ffffff1a;border:1px solid #ffffff40;color:#fff;font-size:26px;display:grid;place-items:center}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.opts button{border:1px solid #ffffff40;border-radius:12px;padding:6px 14px;font-weight:700;color:#fff;background:#ffffff10}.opts button.on{background:#fff;color:#1f2a6b}
.res{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.ban{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 75% 50%,#3c3f7a,#1a1c3a 60%);color:#fff;padding:28px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.ban h2{margin:6px 0;font-size:34px}.ban .em{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:130px;height:130px;border-radius:50%;border:2px solid #ffffff40;background:#ffffff12;display:grid;place-items:center}.ban .em img{height:96px}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat2 div{background:var(--soft);border-radius:14px;padding:12px 14px}.stat2 small{color:var(--mute);font-size:13px}.stat2 b{display:block;font-size:26px;font-weight:900}
.wl{display:grid;gap:10px}.wl details{border:1px solid var(--line);border-radius:14px;padding:12px 16px}.wl summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start}.wl summary::-webkit-details-marker{display:none}
.wl .tag{margin-left:auto;background:#fbe3ea;color:#9b2357;border-radius:8px;padding:0 8px;font-weight:800;font-size:13px;flex:none}
.wl .chip{display:inline-block;border-radius:8px;padding:2px 10px;font-weight:800;margin:10px 6px 0 0}.chip.me{background:#fbe3ea;color:#9b2357}.chip.an{background:#e3f5e8;color:#1d6b3a}
@media(max-width:700px){.tbar{flex-wrap:wrap;gap:10px}.tbar .rt{margin-left:0;width:100%;justify-content:flex-end}.scene{aspect-ratio:16/9}.zone b{font-size:17px}.ban .em{display:none}.oxb button{min-height:58px}}
@media(prefers-reduced-motion:reduce){.scene .pg{animation:none!important}}
footer{border-top:1px solid var(--line);padding:22px 0 36px;color:var(--mute);font-size:13px;text-align:center;line-height:1.7}footer b{color:var(--ink)}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="brand"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#2f55d4"/><path d="M13 9v9M8.5 13.5h9M23 13.5h9M9.5 23.5l7 7M16.5 23.5l-7 7M23 25h9M23 29.5h9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><div>5학년 수학 OX<small>5학년 1학기 · 2학기 수학 온라인 스터디</small></div></div>
  <nav><a href="#home" id="n-home">학습 홈</a><a href="#tower" id="n-tower">무한의 탑</a><a href="#notes" id="n-notes">오답노트</a></nav>

function route(){const h=location.hash.slice(1)||'home';
  if(h==='study'&&run)return drawStudy();
  if(h==='notes')return drawNotes();if(h==='tower')return drawTower();if(BK(h))return drawBook(h);

  <p class="lead" style="margin:16px 0 6px">문제당 제한시간</p><div class="pick" style="grid-template-columns:1fr 1fr 1fr;margin:0">${[[0,'없음'],[20,'20초'],[30,'30초']].map(([k,n])=>`<button data-t="${k}" class="${t.time===k?'on':''}">${n}</button>`).join('')}</div>
  <p class="lead" style="margin:14px 0 0;font-size:14px">바꾼 설정은 다음 문항부터 적용돼요.</p></div></div>`;
  for(const b of m.querySelectorAll('[data-s]'))b.onclick=()=>{t.scope=b.dataset.s;save();draw()};
  for(const b of m.querySelectorAll('[data-t]'))b.onclick=()=>{t.time=+b.dataset.t;save();draw()};
  $('#mx').onclick=()=>m.innerHTML='';$('#bg').onclick=e=>{if(e.target.id==='bg')m.innerHTML=''}};draw()}

function drawTower(){setNav('tower');const t=TS();
  if(!TW||TW.state==='ready'){const cp=t.cp||0,bt=tierOf(t.best||0);
    $('#app').innerHTML=`<div id="tw">${twBar()}<div class="dark">${twScene()}<div class="row" style="justify-content:space-between;margin-top:18px;align-items:flex-end">
    <div><h2>무한의 탑</h2><p>맞히면 한 층씩 올라가요. 하트 3개를 다 쓰면 끝! 10층마다 나오는 보스를 3연속 정답으로 쓰러뜨리면 그 층이 저장돼요.</p>
    <p style="margin-top:10px;opacity:1">최고 기록 <b>${t.best||0}층</b> · 시즌 티어 <b>${bt[1]}</b>${cp?` · 저장된 층 <b>${cp}층</b>`:''}</p>
    ${cp?`<div class="opts"><button id="t1">1층부터</button><button class="on" id="tc">${cp+1}층부터 이어서</button></div>`:''}</div>
    <button class="arrow" id="tgo" aria-label="도전 시작">→</button></div></div></div>`;
    twBind();let from=cp?cp+1:1;if(cp){$('#t1').onclick=()=>{from=1;$('#t1').classList.add('on');$('#tc').classList.remove('on')};$('#tc').onclick=()=>{from=cp+1;$('#tc').classList.add('on');$('#t1').classList.remove('on')}}
    $('#tgo').onclick=()=>twStart(from);return}
  if(TW.state==='trans'){const z=zoneOf(TW.floor);
    $('#app').innerHTML=`<div id="tw">${twBar()}<div class="dark">${twScene()}<div class="row" style="justify-content:space-between;margin-top:18px;align-items:flex-end"><div><p>${TW.floor-1}층 보스를 쓰러뜨렸어요! ${TW.floor-1}층이 저장됐어요.</p><h2 style="margin-top:6px">${z.sub} · ${z.name}</h2></div><button class="arrow" id="tgo" aria-label="다음 구역으로">→</button></div></div></div>`;
    twBind();$('#tgo').onclick=()=>{TW.state='play';twNext();drawTower()};return}
  if(TW.state==='over'){const end=tierOf(Math.max(TW.floor,t.best||0)),up=end[1]!==TW.startTier,season=tierOf(t.best||0);
    $('#app').innerHTML=`<div id="tw">${twBar()}<div class="res"><div class="ban"><small style="opacity:.8">일반모드</small><h2>🏆 ${end[1]} ${up?'승급':'유지'}</h2><p style="opacity:.85;margin:0">하트를 모두 사용했어요.${TW.newBest?' 최고 기록을 새로 세웠어요!':''}</p><div class="em"><img src="${PIG}" alt=""></div></div>
    <div class="stat2"><div><small>도달 층수</small><b>${TW.floor}층</b></div><div><small>시즌 티어</small><b>${season[1]}</b></div></div>
    <div class="row" style="justify-content:space-between"><b style="font-size:18px">📖 오답 복습</b><span style="color:var(--mute);font-weight:700">${TW.wrongs.length}문항</span></div>
    <a href="#notes" style="color:var(--blue2);font-weight:700">복습노트에서 다시 풀기</a>
    <div class="wl">${TW.wrongs.map((w,i)=>`<details ${i===TW.wrongs.length-1?'open':''}><summary><span><b>${w.n}번째 문항</b><br><small style="color:var(--mute)">${BK(w.q.b).name} ${w.q.s}회차 · ${w.q.n}번</small><br>${esc(w.q.q)}</span><span class="tag">${w.p==='T'?'시간 초과':'오답'}</span></summary>
      <span class="chip me">내 답 ${w.p==='T'?'-':w.p}</span><span class="chip an">정답 ${w.q.a}</span><p style="margin:8px 0 0;white-space:pre-line">${esc(w.q.e||'')}</p></details>`).join('')}</div>
    <div class="row"><button class="nextb" id="tr" style="flex:1">다시 도전 →</button></div></div></div>`;
    twBind();$('#tr').onclick=()=>{TW=null;drawTower()};return}
  const q=TW.q,p=TW.p,f=TW.floor,boss=isBoss(f)&&!TW.bossDown,ok=p&&p===q.a;
  $('#app').innerHTML=`<div id="tw">${twBar()}${twScene()}<div class="qc"><div class="qt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>${boss?`${f}층 보스 · OX`:`${TW.n}번째 문항`}<span class="tg">${BK(q.b).name.replace(' 수학','')} · ${q.s}단원</span></div>
  ${boss?`<p class="bossnote">OX 3문제를 연속으로 맞히면 이 층이 저장돼요.</p>`:''}<p class="st">${esc(q.q)}</p>
  ${p?`<div class="fb ${ok?'ok':'bad'}"><div class="h"><span>${ok?'✓ 정답이에요':p==='T'?'⏱ 시간 초과':'✕ 틀렸어요'}</span><span>정답 ${q.a}</span></div><p>${esc(q.e||'')}</p></div>`:''}</div>
  ${p?`<button class="nextb" id="tn">${TW.hearts<=0?'결과 보기':TW.bossDown?'다음 구역으로':'다음 문항'} ›</button>`:`<div class="oxb"><button class="o" data-c="O"><span class="ic">◯</span>맞다</button><button class="x" data-c="X"><span class="ic">✕</span>틀리다</button></div>`}</div>`;
  TW.hurt=false;twBind();
  for(const b of document.querySelectorAll('.oxb button'))b.onclick=()=>twAnswer(b.dataset.c);
  if($('#tn'))$('#tn').onclick=twGo}
function twAnswer(c){if(!TW||TW.state!=='play'||TW.p)return;clearInterval(TWT);const q=TW.q,f=TW.floor,boss=isBoss(f);TW.p=c;const ok=record(q,c);
  if(ok){if(boss){TW.streak++;TW.hitUntil=performance.now()+300;if(TW.streak>=3){TW.bossDown=true;TS().cp=Math.max(TS().cp||0,f);save()}}else{TW.floor++;TW.runUntil=performance.now()+1100}}
  else{TW.hearts--;TW.streak=0;TW.hurt=true;TW.wrongs.push({q,p:c,n:TW.n})}
  drawTower();if(ok&&!boss)setTimeout(()=>{const g=document.querySelector('.scene .pg');if(g&&TW&&TW.runUntil<=performance.now())g.classList.remove('run')},1150)}
function twGo(){if(TW.hearts<=0){TW.state='over';const t=TS();TW.newBest=TW.floor>(t.best||0);if(TW.newBest){t.best=TW.floor}save();drawTower();scrollTo(0,0);return}
  if(TW.bossDown){TW.floor++;TW.bossDown=false;TW.streak=0;TW.state='trans';TW.runUntil=performance.now()+1400;drawTower();return}
  twNext();drawTower()}
document.addEventListener('keydown',e=>{if(location.hash!=='#tower'||!TW||TW.state!=='play'||$('#modal').innerHTML)return;const k=e.key.toLowerCase();
  if(!TW.p){if(k==='o'||k==='1')twAnswer('O');else if(k==='x'||k==='2')twAnswer('X')}else if(k==='enter'||k==='arrowright')twGo()});
document.addEventListener('keydown',e=>{if(location.hash!=='#study'||!run||$('#modal').innerHTML||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
  if(k==='o'||k==='1')answer('O');else if(k==='x'||k==='2')answer('X');else if(k==='arrowright'||k==='enter')go(1);else if(k==='arrowleft')go(-1)});

function drawNotes(){setNav('notes');const keys=Object.keys(S.notes).filter(k=>S.notes[k]===noteTab).map(byId).filter(q=>q&&(noteSes==='all'||noteSes===q.b||noteSes===q.b+':'+q.s)).sort((a,b)=>a.b.localeCompare(b.b)||a.s-b.s||a.n-b.n);
  $('#app').innerHTML=`<h1>오답노트</h1><p class="lead">틀린 문제가 모여요. 다시 풀 때는 순서를 섞어서 문제 화면과 같은 방식으로 풀어요.</p><div class="filters"><div class="seg"><button data-t="todo" class="${noteTab==='todo'?'on':''}">복습할 문제</button><button data-t="done" class="${noteTab==='done'?'on':''}">복습 완료</button></div>
  <select id="fs" aria-label="범위"><option value="all">전체</option>${BOOKS.filter(b=>b.file).map(b=>`<optgroup label="${b.name}"><option value="${b.k}" ${noteSes===b.k?'selected':''}>${b.name} 전체</option>${sesOf(b.k).map(s=>`<option value="${b.k}:${s}" ${noteSes===b.k+':'+s?'selected':''}>${b.name} ${s}회차</option>`).join('')}</optgroup>`).join('')}</select>
  ${keys.length?`<button class="btn p" id="redo">⤮ 오답 랜덤으로 풀기 (${keys.length}문제)</button>`:''}</div>
  <div class="nlist">${keys.length?keys.map(q=>`<article class="card nitem" data-k="${id(q)}"><div style="flex:1 1 420px"><div class="qhead"><span class="pill">${BK(q.b).name} ${q.s}회차</span><span>${q.n}번</span></div><p class="q">${esc(q.q)}</p></div>
  <button class="btn g" data-done>${noteTab==='todo'?'✓ 복습 완료':'↺ 다시 복습'}</button></article>`).join(''):`<div class="empty">${noteTab==='todo'?'복습할 문제가 없어요. 문제를 풀다 틀리면 여기에 모여요.':'아직 복습을 마친 문제가 없어요.'}</div>`}</div>`;
  for(const b of document.querySelectorAll('.seg button'))b.onclick=()=>{noteTab=b.dataset.t;drawNotes()};
  $('#fs').onchange=e=>{noteSes=e.target.value;drawNotes()};
  if($('#redo'))$('#redo').onclick=()=>startRun(shuffle(keys.map(id)),'오답 랜덤 풀기',0,null,true);
  for(const a of document.querySelectorAll('.nitem'))a.querySelector('[data-done]').onclick=()=>{const k=a.dataset.k;S.notes[k]=noteTab==='todo'?'done':'todo';save();drawNotes();toast(noteTab==='todo'?'복습 완료로 옮겼어요':'복습할 문제로 옮겼어요')}}
