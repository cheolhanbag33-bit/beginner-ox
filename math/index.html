<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경찰 초보자용 OX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 또렷한 수험 학습 도구, 군더더기 없이 문제에 집중
   IDEA: 교재를 펼친 학습 카드 — 왼쪽은 문제, 오른쪽은 해설 페이지
   PICTURE: 첫 화면의 짙은 파란 배너와 법전·저울 엠블럼, 회차별 진도 카드
   COLOUR and TYPE: 흰 바탕 + 코발트 블루 주색, O는 파랑 X는 자주, Noto Sans KR
   LAYOUT: 상단 내비 → 배너+나의 학습 → 회차 카드 그리드 → 실전과 복습 */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fb,#0f1320);--card:light-dark(#ffffff,#181e2e);--soft:light-dark(#eef2fb,#20283c);
--ink:light-dark(#161b2b,#e9edf7);--mute:light-dark(#5b6478,#9aa4bb);--line:light-dark(#dfe4ef,#2b3449);
--blue:#2f55d4;--blue2:light-dark(#1f3fae,#7d9bff);--o:light-dark(#2f55d4,#7d9bff);--x:light-dark(#9b2357,#ff7fae);
--ok:light-dark(#e6f4ea,#173326);--okink:light-dark(#1d6b3a,#7fdca2);--bad:light-dark(#fbefe0,#3a2a17);--badink:light-dark(#8a4b06,#ffc27a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;min-height:44px}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;min-height:68px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:10px 16px;border-radius:12px;text-decoration:none;color:var(--mute);font-weight:700;min-height:44px;display:flex;align-items:center}
nav a.on{background:var(--soft);color:var(--blue2)}
main.wrap{padding-top:28px;padding-bottom:64px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.15;word-break:keep-all;margin:0 0 8px;font-weight:900;text-wrap:balance}
h2{font-size:22px;margin:40px 0 14px;font-weight:900}
.lead{color:var(--mute);margin:0 0 20px}
.top{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
.hero{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 78% 50%,#3f6bff 0,#2446c9 38%,#14298a 100%);color:#fff;padding:clamp(24px,4vw,44px);min-height:300px;display:flex;flex-direction:column;justify-content:center}
.hero .tag{align-self:flex-start;border:1px solid #ffffff55;border-radius:99px;padding:4px 14px;font-size:14px;font-weight:700}
.hero h1{color:#fff;margin:18px 0 10px;max-width:8.5em;position:relative;z-index:1}.hero p,.hero .tag{position:relative;z-index:1}
.hero p{margin:0 0 22px;opacity:.9}
.hero svg{position:absolute;right:-10px;bottom:-10px;width:min(34%,240px);height:auto;opacity:.95}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border-radius:14px;padding:10px 22px;font-weight:700}
.btn.w{background:#fff;color:#1f3fae;align-self:flex-start;position:relative;z-index:1}
.btn.p{background:var(--blue);color:#fff}
.btn.g{background:var(--soft);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.me .big{font-size:clamp(40px,5vw,52px);font-weight:900;line-height:1}
.me .big span{font-size:16px;color:var(--mute);font-weight:500}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me a,.linkbtn{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-weight:700;width:100%;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.sess{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;transition:transform .15s,border-color .15s}
.sess:hover{transform:translateY(-2px);border-color:var(--blue)}
.sess.lock{opacity:.55;cursor:not-allowed;transform:none;border-style:dashed}.sess.lock:hover{border-color:var(--line)}
.pill{display:inline-block;background:var(--soft);color:var(--blue2);font-weight:700;font-size:13px;border-radius:99px;padding:2px 10px}
.sess b{display:block;font-size:22px;margin:8px 0 2px;word-break:keep-all}
.sess small{color:var(--mute);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wide{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.wide small{display:block;color:var(--mute);font-size:14px}
.yt{color:inherit;text-decoration:none;border:2px solid #e0322b;background:light-dark(#fff5f4,#2a1716);transition:transform .15s}.yt:hover{transform:translateY(-2px)}.yt b{color:light-dark(#c4221b,#ff8a84)}.ico.play{background:#e0322b;color:#fff;border-radius:50%}.yt .go{margin-left:auto;font-size:26px;font-weight:900;color:#e0322b}
.ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--blue2);flex:none}
/* study */
.back{color:var(--mute);font-weight:700;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.study{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.qhead{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;font-weight:700}
.qhead .cnt{margin-left:auto;font-weight:500}
.q{font-size:clamp(19px,2.2vw,23px);font-weight:700;line-height:1.65;margin:16px 0 22px;word-break:keep-all}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{border-radius:16px;border:2px solid transparent;background:var(--soft);min-height:64px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px}
.ox .o{color:var(--o)}.ox .x{color:var(--x)}
.ox button.sel.o{border-color:var(--o)}.ox button.sel.x{border-color:var(--x)}
.ox button.ans{box-shadow:inset 0 0 0 2px currentColor}
.exp .wait{min-height:220px;display:grid;place-items:center;text-align:center;color:var(--mute)}
.res{border-radius:16px;padding:14px 18px;font-weight:900;font-size:18px;margin-bottom:14px}
.res.ok{background:var(--ok);color:var(--okink)}.res.bad{background:var(--bad);color:var(--badink)}
.ebox{background:var(--soft);border-radius:16px;padding:16px 18px}
.ebox .row{justify-content:space-between;font-weight:900;color:var(--blue2);margin-bottom:6px}
.ebox p{margin:0;word-break:keep-all;white-space:pre-line}
.teach{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px}.side .ytc,.side .cafe{min-height:0}.side .ytc img{flex:none;height:55%;max-height:none}.side .ytc .yb{flex:1;padding:8px 14px;gap:10px}.side .ytc b{font-size:15px}.side .ytc small{font-size:12px}.side .ytc .ico{width:36px;height:36px}.cafe{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid #03a94f;border-radius:20px;background:light-dark(#effbf3,#13281c);color:inherit;text-decoration:none;transition:transform .15s}.cafe:hover{transform:translateY(-2px)}.cafe b{display:block;color:light-dark(#02853e,#6fe3a1);font-size:16px;line-height:1.35;word-break:keep-all}.cafe small{display:block;color:var(--mute);font-size:13px;margin-top:2px}.cafe{padding:0 16px 0 10px;overflow:hidden;align-items:stretch}.cafe>span{align-self:center;padding:12px 0}.cafe{position:relative;padding-left:112px!important;min-height:150px}.chimg{position:absolute;left:8px;bottom:0;height:calc(100% - 8px);width:auto;object-fit:contain;object-position:bottom}.cafe b{font-size:17px}
.ytc{display:flex;flex-direction:column;border:2px solid #e0322b;border-radius:20px;overflow:hidden;background:light-dark(#fff5f4,#2a1716);color:inherit;text-decoration:none;transition:transform .15s}.ytc:hover{transform:translateY(-2px)}.ytc img{display:block;width:100%;flex:1 1 50%;min-height:0;height:50%;object-fit:cover;object-position:55% 40%}.ytc .yb{flex:1 1 50%;display:flex;gap:12px;align-items:center;padding:14px 16px}.ytc b{display:block;color:light-dark(#c4221b,#ff8a84);font-size:16px;line-height:1.35;word-break:keep-all}.ytc small{display:block;color:var(--mute);font-size:13px;margin-top:2px;word-break:keep-all}
@media(min-width:1760px){.side .cafe{padding-left:100px!important}.top{position:relative;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}.top .side{position:absolute;top:0;bottom:0;left:calc(100% + 32px);width:min(320px,calc((100vw - 1100px)/2 - 64px))}}
@media(max-width:1080px){.top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.top .hero{grid-column:1/-1}}.teach .sess{padding:26px 28px}.teach .sess b{font-size:clamp(24px,3vw,32px)}
.nitem{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.nitem .q{font-size:17px;margin:8px 0 0;font-weight:500}
@media(max-width:600px){.teach{grid-template-columns:1fr}}
.navq{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.dots button{width:34px;height:34px;min-height:34px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:700;color:var(--mute)}
.dots button.c{background:var(--ok);color:var(--okink)}.dots button.w{background:var(--bad);color:var(--badink)}
.dots button.cur{outline:2px solid var(--blue)}
/* notes */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{border-radius:11px;padding:6px 16px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--blue2);box-shadow:0 1px 3px #0002}
select{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:44px;font-size:16px}
.nlist{display:grid;gap:14px}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{width:min(460px,100%)}
.modal h3{margin:0 0 4px;font-size:22px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.pick button{border:2px solid var(--line);border-radius:16px;padding:16px;font-weight:700;display:grid;justify-items:center;gap:6px}
.pick button.on{border-color:var(--blue);color:var(--blue2);background:var(--soft)}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:30}
@media(max-width:860px){.top,.study,.two{grid-template-columns:1fr}.hero svg{width:38%;opacity:.35}}
@media(max-width:600px){nav{margin-left:0;width:100%}nav a{flex:1;justify-content:center;padding:8px}.hd{padding:8px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}img{-webkit-user-drag:none;pointer-events:auto}@media print{body{display:none!important}}
footer{border-top:1px solid var(--line);padding:22px 0 36px;color:var(--mute);font-size:13px;text-align:center;line-height:1.7}footer b{color:var(--ink)}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="brand"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#2f55d4"/><path d="M20 9v22M12 31h16M11 14h18M11 14l-4 9h8zM29 14l-4 9h8z" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"/></svg><div>경찰 초보자용 OX<small>5학년 1학기 · 2학기 수학 온라인 스터디</small></div></div>
  <nav><a href="#home" id="n-home">학습 홈</a><a href="#notes" id="n-notes">오답노트</a></nav>
</div></header>
<main class="wrap" id="app"><p class="empty">문제를 불러오는 중이에요…</p></main>
<footer class="wrap"><b>© 박철한 경찰헌법</b> · 경찰 초보자용 OX<br>이 사이트의 문제·해설·이미지의 저작권은 박철한에게 있으며, 무단 복제·전재·배포를 금지합니다.</footer><div id="modal"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='math5-ox-v1';
let D=[],S={ans:{},notes:{},resume:null};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v)S=Object.assign(S,v)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const id=q=>q.b+'-'+q.s+'-'+q.n;
const BOOKS=[{k:'m1',name:'5학년 1학기 수학',file:'m1.txt',open:[1,2,3,4,5,6],T:{"1": "자연수의 혼합 계산", "2": "약수와 배수", "3": "규칙과 대응", "4": "약분과 통분", "5": "분수의 덧셈과 뺄셈", "6": "다각형의 둘레와 넓이"}},{k:'m2',name:'5학년 2학기 수학',file:'m2.txt',open:[1,2,3,4,5,6],T:{"1": "수의 범위와 어림하기", "2": "분수의 곱셈", "3": "합동과 대칭", "4": "소수의 곱셈", "5": "직육면체와 정육면체", "6": "평균과 가능성"}}];
const BK=k=>BOOKS.find(b=>b.k===k);
const sesOf=b=>Object.keys(BK(b).T).map(Number);
let run=null,noteTab='todo',noteSes='all';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1600)}
function record(q,pick){const ok=pick===q.a;S.ans[id(q)]={p:pick,ok};if(!ok)S.notes[id(q)]='todo';save();return ok}
function stat(list){let d=0,c=0;for(const q of list){const r=S.ans[id(q)];if(r){d++;if(r.ok)c++}}return{d,c}}
const todo=()=>Object.keys(S.notes).filter(k=>S.notes[k]==='todo').length;
const icon={book:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>',note:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h6"/></svg>'};
const emblem='<svg viewBox="0 0 300 260" aria-hidden="true"><circle cx="170" cy="140" r="120" fill="#ffffff10"/><circle cx="170" cy="140" r="84" fill="#ffffff12"/><rect x="88" y="150" width="170" height="86" rx="10" fill="#0d1d66"/><rect x="96" y="142" width="170" height="86" rx="10" fill="#f3f5ff"/><path d="M181 146v78" stroke="#c7cff5" stroke-width="3"/><path d="M110 170h56M110 186h56M110 202h40M196 170h56M196 186h56M196 202h40" stroke="#9aa9e8" stroke-width="5" stroke-linecap="round"/><path d="M181 40v92" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M131 64h100" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="181" cy="40" r="9" fill="#ffd9e6"/><path d="M131 64l-22 44h44z M231 64l-22 44h44z" fill="#ffffff30" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M109 108a22 10 0 0 0 44 0zM209 108a22 10 0 0 0 44 0z" fill="#fff"/></svg>';

function setNav(v){for(const k of['home','notes'])$('#n-'+k).classList.toggle('on',k===v)}
function route(){const h=location.hash.slice(1)||'home';
  if(h==='study'&&run)return drawStudy();
  if(h==='notes')return drawNotes();if(BK(h))return drawBook(h);
  if(h==='study'){location.hash='home';return}
  drawHome()}

function drawHome(){setNav('home');const all=stat(D),pct=Math.round(all.d/D.length*100);
  $('#app').innerHTML=`<div class="top"><section class="hero"><span class="tag">∞ 경찰 초보자용 OX</span><h1>합격의 기본은 무한회독</h1><p>5학년 1학기 · 2학기 수학, 풀고 틀리고 다시 풀며 내 것으로.</p>
  <button class="btn w" id="cont">${S.resume&&S.resume.ids.every(byId)?'이어 풀기':'학습 시작'} →</button>${emblem}</section>
  <aside class="card me"><div class="row" style="font-weight:900;font-size:18px"><span class="ico">${icon.book}</span>나의 학습</div>

function drawBook(bk){setNav('');const B=BK(bk);
  $('#app').innerHTML=`<button class="back" id="bh">← 학습 홈</button><h1>${B.name}</h1><p class="lead">회차를 고르면 순서대로 또는 랜덤으로 풀 수 있어요.</p><div class="grid">${sesOf(bk).map(s=>{if(!B.open.includes(s))return`<div class="sess lock" aria-disabled="true"><span class="pill">${s}회차</span><b>${esc(B.T[s])}</b><small>🔒 공개 예정 · 아직 풀 수 없어요</small></div>`;const l=D.filter(q=>q.b===bk&&q.s===s),t=stat(l);return`<button class="sess" data-s="${s}"><span class="pill">${s}회차</span><b>${esc(B.T[s])}</b><small>${l.length}문항 · 푼 문제 ${t.d} · 정답 ${t.c}</small><div class="bar"><i style="width:${t.d/l.length*100}%"></i></div></button>`}).join('')}</div>`;
  $('#bh').onclick=()=>location.hash='home';for(const b of document.querySelectorAll('button.sess'))b.onclick=()=>pickMode(bk,+b.dataset.s)}
function confirmBox(t,sub,ok){const m=$('#modal');m.innerHTML=`<div class="modal"><div class="card"><h3>${esc(t)}</h3><p class="lead">${esc(sub)}</p><div class="row" style="justify-content:flex-end"><button class="btn g" id="cn">취소</button><button class="btn p" id="cy">확인</button></div></div></div>`;
  $('#cn').onclick=()=>m.innerHTML='';$('#cy').onclick=()=>{m.innerHTML='';ok()}}

function pickMode(bk,s){let mode='seq';const m=$('#modal');const l=D.filter(q=>q.b===bk&&q.s===s);
  const draw=()=>{m.innerHTML=`<div class="modal" id="bg"><div class="card"><div class="row" style="justify-content:space-between"><h3>학습 방식 선택</h3><button id="mx" aria-label="닫기" style="font-size:22px;width:44px">✕</button></div>
  <p class="lead" style="margin:0">${BK(bk).name} · ${s}회차 ${esc(BK(bk).T[s])} · ${l.length}문항</p><div class="pick"><button data-m="seq" class="${mode==='seq'?'on':''}"><b>1 2 3</b>순서대로</button><button data-m="rnd" class="${mode==='rnd'?'on':''}"><b>⤮</b>랜덤</button></div>
  <button class="btn p" id="go" style="width:100%">문제 풀기 →</button></div></div>`;
  for(const b of m.querySelectorAll('.pick button'))b.onclick=()=>{mode=b.dataset.m;draw()};
  $('#mx').onclick=()=>m.innerHTML='';$('#bg').onclick=e=>{if(e.target.id==='bg')m.innerHTML=''};
  $('#go').onclick=()=>{m.innerHTML='';let ids=l.map(id);if(mode==='rnd')ids=shuffle(ids);startRun(ids,BK(bk).name+' '+s+'회차'+(mode==='rnd'?' · 랜덤':''),0,bk)}};draw()}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const byId=k=>D.find(q=>id(q)===k);
function startRun(ids,title,i,b,nt){run={ids,title,b,nt,i:Math.min(i||0,ids.length-1),picked:{}};S.resume={ids,title,b,nt,i:run.i};save();if(location.hash==='#study')drawStudy();else location.hash='study'}

function drawStudy(){setNav('');const q=byId(run.ids[run.i]),k=id(q),p=run.picked[k];
  S.resume={ids:run.ids,title:run.title,b:run.b,nt:run.nt,i:run.i};save();
  const right=p?`<div class="res ${p===q.a?'ok':'bad'}">${p===q.a?'✓ 정답이에요!':'오답노트에 담았어요.'}</div><div class="ebox"><div class="row"><span>정답 및 해설</span><span>[${q.a}]</span></div>${q.e?`<p>${esc(q.e)}</p>`:`<p style="color:var(--mute)">정답은 ${q.a}입니다.</p>`}</div>${run.nt?`<button class="btn g" id="done" style="margin-top:14px">${S.notes[k]==='done'?'↺ 다시 복습할 문제로':'✓ 복습 완료 표시'}</button>`:''}`:`<div class="wait"><div>${icon.book}<br>답을 고르면 해설이 열려요.</div></div>`;
  $('#app').innerHTML=`<button class="back" id="bk">← ${run.nt?'오답노트':run.b?BK(run.b).name+' 회차 목록':'학습 홈'}</button><div class="study"><section class="card"><div class="qhead"><span class="pill">${BK(q.b).name} ${q.s}회차</span><span>${q.n}번</span><span class="cnt">${run.i+1} / ${run.ids.length}</span></div>
  <p class="q">${esc(q.q)}</p><div class="ox">${['O','X'].map(c=>`<button class="${c.toLowerCase()} ${p===c?'sel':''} ${p&&q.a===c?'ans':''}" data-c="${c}" aria-label="${c}">${c==='O'?'◯':'✕'} ${c}</button>`).join('')}</div></section>
  <section class="card exp" aria-live="polite">${right}</section></div>
  <div class="navq"><button class="btn g" id="pv" ${run.i?'':'disabled style="opacity:.4"'}>← 이전</button><button class="btn p" id="nx">${run.i<run.ids.length-1?'다음 →':'완료'}</button></div>
  <div class="dots">${run.ids.map((x,j)=>{const r=run.picked[x];const c=r?(r===byId(x).a?'c':'w'):'';return`<button class="${c} ${j===run.i?'cur':''}" data-j="${j}">${j+1}</button>`}).join('')}</div>`;
  for(const b of document.querySelectorAll('.ox button'))b.onclick=()=>answer(b.dataset.c);
  for(const b of document.querySelectorAll('.dots button'))b.onclick=()=>{run.i=+b.dataset.j;drawStudy()};
  $('#bk').onclick=()=>location.hash=run.nt?'notes':run.b||'home';if($('#done'))$('#done').onclick=()=>{S.notes[k]=S.notes[k]==='done'?'todo':'done';save();drawStudy()};$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1)}
function answer(c){const q=byId(run.ids[run.i]);if(run.picked[id(q)])return;run.picked[id(q)]=c;record(q,c);drawStudy()}
function go(d){const n=run.i+d;if(n<0)return;if(n>=run.ids.length){const v=Object.keys(run.picked),ok=v.filter(x=>run.picked[x]===byId(x).a).length;S.resume=null;save();toast(`${run.title} 완료 · ${v.length}문제 중 ${ok}문제 정답`);location.hash=run.nt?'notes':run.b||'home';return}run.i=n;drawStudy();scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(location.hash!=='#study'||!run||$('#modal').innerHTML||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
  if(k==='o'||k==='1')answer('O');else if(k==='x'||k==='2')answer('X');else if(k==='arrowright'||k==='enter')go(1);else if(k==='arrowleft')go(-1)});

function drawNotes(){setNav('notes');const keys=Object.keys(S.notes).filter(k=>S.notes[k]===noteTab).map(byId).filter(q=>q&&(noteSes==='all'||noteSes===q.b||noteSes===q.b+':'+q.s)).sort((a,b)=>a.b.localeCompare(b.b)||a.s-b.s||a.n-b.n);
  $('#app').innerHTML=`<h1>오답노트</h1><p class="lead">틀린 문제가 모여요. 다시 풀 때는 순서를 섞어서 문제 화면과 같은 방식으로 풀어요.</p><div class="filters"><div class="seg"><button data-t="todo" class="${noteTab==='todo'?'on':''}">복습할 문제</button><button data-t="done" class="${noteTab==='done'?'on':''}">복습 완료</button></div>
  <select id="fs" aria-label="범위"><option value="all">전체</option>${BOOKS.filter(b=>b.file).map(b=>`<optgroup label="${b.name}"><option value="${b.k}" ${noteSes===b.k?'selected':''}>${b.name} 전체</option>${sesOf(b.k).map(s=>`<option value="${b.k}:${s}" ${noteSes===b.k+':'+s?'selected':''}>${b.name} ${s}회차</option>`).join('')}</optgroup>`).join('')}</select>
  ${keys.length?`<button class="btn p" id="redo">⤮ 오답 랜덤으로 풀기 (${keys.length}문제)</button>`:''}</div>
  <div class="nlist">${keys.length?keys.map(q=>`<article class="card nitem" data-k="${id(q)}"><div style="flex:1 1 420px"><div class="qhead"><span class="pill">${BK(q.b).name} ${q.s}회차</span><span>${q.n}번</span></div><p class="q">${esc(q.q)}</p></div>
  <button class="btn g" data-done>${noteTab==='todo'?'✓ 복습 완료':'↺ 다시 복습'}</button></article>`).join(''):`<div class="empty">${noteTab==='todo'?'복습할 문제가 없어요. 문제를 풀다 틀리면 여기에 모여요.':'아직 복습을 마친 문제가 없어요.'}</div>`}</div>`;
  for(const b of document.querySelectorAll('.seg button'))b.onclick=()=>{noteTab=b.dataset.t;drawNotes()};
  $('#fs').onchange=e=>{noteSes=e.target.value;drawNotes()};
  if($('#redo'))$('#redo').onclick=()=>startRun(shuffle(keys.map(id)),'오답 랜덤 풀기',0,null,true);
  for(const a of document.querySelectorAll('.nitem'))a.querySelector('[data-done]').onclick=()=>{const k=a.dataset.k;S.notes[k]=noteTab==='todo'?'done':'todo';save();drawNotes();toast(noteTab==='todo'?'복습 완료로 옮겼어요':'복습할 문제로 옮겼어요')}}
